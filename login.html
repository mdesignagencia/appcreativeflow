<script>
  function switchTab(tab){
    document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(tab==='client'&&i===0)||(tab==='admin'&&i===1)));
    document.getElementById('panel-client').classList.toggle('active',tab==='client');
    document.getElementById('panel-admin').classList.toggle('active',tab==='admin');
    clearError();
  }

  function showError(msg){
    const el=document.getElementById('errorMsg');
    el.textContent=msg;
    el.classList.add('show');
  }

  function clearError(){
    document.getElementById('errorMsg').classList.remove('show');
  }

  async function loginClient(){
    const email=document.getElementById('clientEmail').value.trim();
    const password=document.getElementById('clientPassword').value;

    if(!email) return showError('Preencha seu email.');
    if(!password) return showError('Preencha sua senha.');

    const btn=document.getElementById('btnClient');

    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span> Verificando...';

    try{
      const res=await fetch('/api/client/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email,password})
      });

      const data=await res.json();

      if(!res.ok){
        showError(data.error||'Email ou senha incorretos.');
        return;
      }

      localStorage.setItem('cf_client_email',email);
      localStorage.setItem('cf_client_password',password);
      localStorage.setItem('cf_role','client');

      window.location.href='/client';

    }catch{
      showError('Erro de conexão. Tente novamente.');
    }

    finally{
      btn.disabled=false;
      btn.innerHTML='Entrar no Dashboard';
    }
  }

  // LOGIN ADMIN COM SENHA FIXA
  function loginAdmin(){

    const ADMIN_PASSWORD = "Admin1410";

    const secret=document.getElementById('adminSecret').value.trim();

    if(!secret){
      return showError('Digite a senha administrativa.');
    }

    const btn=document.getElementById('btnAdmin');

    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span> Autenticando...';

    setTimeout(()=>{

      if(secret === ADMIN_PASSWORD){

        localStorage.setItem('cf_admin_token',secret);
        localStorage.setItem('cf_role','admin');

        window.location.href='/admin';

      }else{
        showError('Senha incorreta.');
      }

      btn.disabled=false;
      btn.innerHTML='Acessar Painel Admin';

    },800);
  }

  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      if(document.getElementById('panel-client').classList.contains('active')){
        loginClient();
      }else{
        loginAdmin();
      }
    }
  });
</script>
